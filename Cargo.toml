[package]
name = "MangoOS"
version = "0.1.0"
edition = "2024"
authors = ["thehuziek"]

# the profile used for `cargo build`
[profile.dev]
panic = "abort" # disable stack unwinding on panic

# the profile used for `cargo build --release`
[profile.release]
panic = "abort" # disable stack unwinding on panic

[dependencies]
bitflags = "2.13.2"
fdt = "0.1.5"
